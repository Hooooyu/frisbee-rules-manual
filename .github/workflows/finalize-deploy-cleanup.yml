name: 一次性网页同步

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-web:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 获取 PR 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装网页生成依赖
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 更新网页生成器
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('build_web_handbook.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '    "1": "比赛精神",': '    "1": "飞盘精神",',
              '    "6": "开始比赛",': '    "6": "比赛开始",',
              '    "7": "发盘",': '    "7": "开盘",',
              '    "9": "stall 计数",': '    "9": "读秒",',
              '    "10": "检查",': '    "10": "验盘（Check）",',
              '    "12": "接盘者与站位",': '    "12": "接盘队员与位置",',
              '    "13": "攻守转换",': '    "13": "攻防转换",',
              '    "15": "犯规、违例与违规的呼叫",': '    "15": "犯规、违规和违例的示意",',
              '    "16": "呼叫后的继续比赛",': '    "16": "示意后的比赛继续",',
              '    "18": "违例与违规",': '    "18": "违规和违例",',
              '    "19": "安全暂停",': '    "19": "安全中断",',
              '["发盘（pull）", "每半场开始及得分后，由防守方发出、用于开始比赛的飞盘。"],': '["开盘（pull）", "每半场开始及得分后，由防守方发出、用于开始比赛的飞盘。"],',
              '["攻守转换（turnover）", "导致拥有持盘权的队伍改变的任何事件；不属于违例。"],': '["攻防转换（turnover）", "导致拥有持盘权的队伍改变的任何事件；不属于违例。"],',
              '["检查（check）", "暂停后的恢复程序；恢复后比赛重新进入 live 状态。"],': '["验盘（check）", "暂停后的恢复程序；恢复后比赛重新进入 live 状态。"],',
              '["比赛精神（Spirit of the Game）", "极限飞盘的自主裁判基础：队员共同负责公平、规则与争议解决。"],': '["飞盘精神（Spirit of the Game）", "极限飞盘的自主裁判基础：队员共同负责公平、规则与争议解决。"],',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'术语状态异常：{old}')

          marker = '\n\ndef reviewed_annotations() -> tuple[dict[str, str], dict[str, object]]:\n'
          if 'def reviewed_annotations_front_matter()' not in text:
              if marker not in text:
                  raise SystemExit('找不到官方注释函数插入位置')
              helper = r'''


def reviewed_annotations_front_matter() -> tuple[dict[str, str], dict[str, list[str]]]:
    """Load Chinese-only revision notice and contents before Introduction."""
    markdown = REVIEWED_ANNOTATIONS_PATH.read_text(encoding="utf-8")
    titles = {"Revision Notice": "修订公告", "Contents": "目录"}
    content: dict[str, list[str]] = {"Revision Notice": [], "Contents": []}
    current_section: str | None = None
    for raw in markdown.splitlines():
        line = raw.strip()
        if line == "# 修订公告":
            current_section = "Revision Notice"
            continue
        if line == "# 目录":
            current_section = "Contents"
            continue
        if line == "# 引言":
            break
        if current_section is None or not line or line.startswith("#"):
            continue
        if line.startswith(">"):
            line = line[1:].strip()
        if line:
            content[current_section].append(line.replace("**", "").replace("`", ""))
    return titles, content
'''
              text = text.replace(marker, helper + marker, 1)

          anchor = '    elif meta["id"] == "annotations":\n        reviewed_titles, reviewed = reviewed_annotations()\n'
          extra = '        front_titles, front_content = reviewed_annotations_front_matter()\n        reviewed_titles.update(front_titles)\n        reviewed.update(front_content)\n'
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('找不到官方注释加载逻辑')
              text = text.replace(anchor, anchor + extra, 1)

          anchor = '    rendered = []\n    for section in sections:\n'
          replacement = '''    rendered = []
    if meta["id"] == "annotations":
        for key in ("Revision Notice", "Contents"):
            values = reviewed.get(key, [])
            if values:
                rendered.append({
                    "id": f"annotations-{key.lower().replace(' ', '-')}",
                    "key": key,
                    "title": reviewed_titles[key],
                    "paragraphs": [{"zh": value, "en": "", "page": None} for value in values],
                })
    for section in sections:
'''
          if 'for key in ("Revision Notice", "Contents"):' not in text:
              if anchor not in text:
                  raise SystemExit('找不到网页章节插入位置')
              text = text.replace(anchor, replacement, 1)

          required_anchor = '        "24. Match Point / 赛点",\n'
          required_extra = '        "本项目为非官方中文阅读版",\n        "修订公告",\n        "验盘（Check）",\n        "攻防转换",\n'
          if '        "本项目为非官方中文阅读版",\n' not in text:
              if required_anchor not in text:
                  raise SystemExit('找不到回归检查插入位置')
              text = text.replace(required_anchor, required_anchor + required_extra, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: 重新生成并校验网页
        shell: bash
        run: |
          python build_web_handbook.py
          grep -Fq '修订公告' web/data.js
          grep -Fq '本项目为非官方中文阅读版' web/data.js
          grep -Fq '飞盘精神' web/data.js
          grep -Fq '验盘（Check）' web/data.js
          grep -Fq '攻防转换' web/data.js
          git diff --check

      - name: 提交生成结果到 PR 分支
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/deploy-sync.trigger
          git add build_web_handbook.py web/data.js
          if git diff --cached --quiet; then
            echo "没有需要提交的同步变更"
            exit 0
          fi
          git commit -m "Sync reviewed Chinese content into web handbook"
          git push origin HEAD:"$HEAD_BRANCH"
