name: 清理已合并分支

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 删除已合并和临时分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          branches=(
            "agent/fix-annotation-cross-references"
            "chore/chinese-content-finalize-20260818"
            "fix/preserve-reading-position-toggle-source"
            "agent/deploy-sync-cleanup"
            "agent/deploy-sync-cleanup-temp"
            "$MERGED_HEAD"
          )
          for branch in "${branches[@]}"; do
            [ "$branch" = "main" ] && continue
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done
