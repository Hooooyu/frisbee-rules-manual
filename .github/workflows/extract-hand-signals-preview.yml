name: 验证附录手势图提取

on:
  push:
    branches: [agent/add-hand-signal-images]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 准备 Appendix v2.0 源文件
        run: |
          mkdir -p tmp/hand-signals
          cp docs/source-pdf/WFDF-Rules-of-Ultimate-2025-2028-Appendix-v2.0.pdf \
            tmp/hand-signals/source-appendix-v2.0.pdf

      - name: 上传源文件用于精确提取验证
        uses: actions/upload-artifact@v4
        with:
          name: appendix-hand-signals-source
          path: tmp/hand-signals/source-appendix-v2.0.pdf
          if-no-files-found: error
