name: 提取附录手势图

on:
  push:
    branches: [agent/add-hand-signal-images]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装提取依赖
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 从 Appendix v2.0 提取 24 张手势图
        run: |
          python tools/extract_appendix_hand_signals.py \
            --manifest /tmp/hand-signals-manifest.json
          cat /tmp/hand-signals-manifest.json

      - name: 提交提取出的网页图片资产
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/figures/hand-signals/
          if git diff --cached --quiet; then
            echo "No extracted image changes to commit."
          else
            git commit -m "add extracted hand-signal assets"
            git push
          fi
