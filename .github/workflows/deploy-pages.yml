name: 部署 GitHub Pages

# GitHub Pages 发布源：GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 检查待发布网页
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/data.js
          test -s web/app.js
          test -s web/declaration-patch.js
          node --check web/data.js
          node --check web/declaration-patch.js
          grep -Fq 'declaration-patch.js' web/index.html
          grep -Fq 'annotations-revision-notice' web/declaration-patch.js
          grep -Fq 'Revision Notice' web/declaration-patch.js
          grep -Fq '23 处编号差异' web/declaration-patch.js
          grep -Fq '已校正' web/declaration-patch.js
          ! grep -Fq '待校正' web/declaration-patch.js
          ! grep -Fq '待校正' web/data.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包网站
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4
