name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装网页生成依赖
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 从最新中文校订稿生成网页
        run: python tools/build_reviewed_web.py

      - name: 验证官方注释已同步
        shell: bash
        run: |
          grep -Fq '"title":"修订公告"' web/data.js
          grep -Fq '"title":"目录"' web/data.js
          grep -Fq '本项目为非官方中文阅读版' web/data.js
          grep -Fq '"title":"飞盘精神"' web/data.js
          grep -Fq '"title":"验盘（Check）"' web/data.js
          grep -Fq '"title":"攻防转换"' web/data.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4
