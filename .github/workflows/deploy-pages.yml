name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装网页生成依赖
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 从最新中文校订稿生成网页
        run: python tools/build_reviewed_web.py

      - name: 验证官方注释已同步
        shell: bash
        run: |
          grep -Fq '"title":"关于英文《Official Annotations》中规则引用编号的校订说明"' web/data.js
          grep -Fq '部分中文注释中的规则编号会有意与英文 Official Annotations PDF 不同' web/data.js
          grep -Fq '下表完整记录目前确认的 23 处编号差异' web/data.js
          grep -Fq '| 23 | 18.15「走步违例后的比赛恢复」标题 | 18.2.7 | 18.2.6 | 待校正 |' web/data.js
          grep -Fq '"title":"飞盘精神"' web/data.js
          grep -Fq '"title":"验盘（Check）"' web/data.js
          grep -Fq '"title":"攻防转换"' web/data.js
          if grep -Fq '"title":"修订公告"' web/data.js; then
            echo '网页仍在显示被替换的通用修订公告'
            exit 1
          fi
          if grep -Fq '"title":"目录"' web/data.js; then
            echo '网页正文错误地重复渲染了目录'
            exit 1
          fi
          if grep -Fq '"key":"Contents"' web/data.js; then
            echo '网页数据仍包含旧的 Contents 正文章节'
            exit 1
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4
