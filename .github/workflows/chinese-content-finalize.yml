name: 一次性中文内容校正收口

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 获取 PR 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 校正官方注释并补充修订公告与目录
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/WFDF团队飞盘规则2025-2028_官方注释_中文校订整合版.md')
          text = path.read_text(encoding='utf-8')

          canonical = {
              1: '飞盘精神',
              2: '比赛场地',
              3: '装备',
              4: '回合、得分与比赛',
              5: '队伍',
              6: '比赛开始',
              7: '开盘',
              8: '比赛状态',
              9: '读秒',
              10: '验盘（Check）',
              11: '出界',
              12: '接盘队员与位置',
              13: '攻防转换',
              14: '得分',
              15: '犯规、违规和违例的示意',
              16: '示意后的比赛继续',
              17: '犯规',
              18: '违规和违例',
              19: '安全中断',
              20: '暂停',
          }

          for number, title in canonical.items():
              text, count = re.subn(
                  rf'^# {number}\.\s*.*$',
                  f'# {number}. {title}',
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit(f'第 {number} 章标题数量异常：{count}')

          if '# 修订公告' not in text and '# 目录' not in text:
              notice = '''# 修订公告

> 本项目为非官方中文阅读版。正式比赛请以赛事公布的适用版本、WFDF 英文原版及现场裁量为准。
>
> 本次修订对中文版内容进行了逐条校正与术语统一；修订仅用于提升中文译文的准确性、一致性与可读性，不构成 WFDF 官方中文版本。如中文表述与 WFDF 英文原文存在歧义或冲突，以 WFDF 英文原文为准。'''
              toc_lines = ['引言', '原则'] + [f'{number}. {canonical[number]}' for number in range(1, 21)]
              toc = '# 目录\n\n' + '  \n'.join(toc_lines)
              if text.count('# 引言') != 1:
                  raise SystemExit('引言标题数量异常')
              before, after = text.split('# 引言', 1)
              text = before.rstrip() + '\n\n' + notice + '\n\n' + toc + '\n\n# 引言' + after
          elif not ('# 修订公告' in text and '# 目录' in text):
              raise SystemExit('修订公告与目录状态不一致')

          required = [
              '# 修订公告', '# 目录', '# 1. 飞盘精神', '# 7. 开盘', '# 9. 读秒',
              '# 10. 验盘（Check）', '# 12. 接盘队员与位置', '# 13. 攻防转换',
              '# 15. 犯规、违规和违例的示意', '# 16. 示意后的比赛继续',
              '# 18. 违规和违例', '# 19. 安全中断', '显著的严重伤害风险',
              '## 18.13. 拍盘（Tipping）（18.2.5.5）', '9.5.5', '9.5.5.1', '9.5.5.2',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'校正回归检查失败：{missing}')
          if not (text.index('# 修订公告') < text.index('# 目录') < text.index('# 引言')):
              raise SystemExit('修订公告、目录、引言顺序错误')

          path.write_text(text, encoding='utf-8')
          print('官方注释中文版校正完成。')
          PY

      - name: 检查并提交到 PR 分支
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git diff --check
          if git diff --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WFDF团队飞盘规则2025-2028_官方注释_中文校订整合版.md
          git commit -m "Finalize Chinese annotations wording and front matter"
          git push origin HEAD:"$HEAD_BRANCH"
