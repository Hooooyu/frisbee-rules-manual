name: 验证 Pages 线上内容

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  verify-live:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 等待并核验线上校订内容
        shell: bash
        env:
          RUN_KEY: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL --retry 2 --retry-delay 2 \
              "https://hooooyu.github.io/frisbee-rules-manual/data.js?verify=${RUN_KEY}-${attempt}" \
              -o /tmp/live-data.js \
              && grep -Fq '"title":"修订公告"' /tmp/live-data.js \
              && grep -Fq '"title":"目录"' /tmp/live-data.js \
              && grep -Fq '本项目为非官方中文阅读版' /tmp/live-data.js \
              && grep -Fq '"title":"飞盘精神"' /tmp/live-data.js \
              && grep -Fq '"title":"验盘（Check）"' /tmp/live-data.js \
              && grep -Fq '"title":"攻防转换"' /tmp/live-data.js; then
              echo "线上 Pages 已包含本轮校订内容。"
              exit 0
            fi
            sleep 5
          done
          echo "线上 Pages 在验证窗口内仍未出现本轮校订内容。" >&2
          exit 1

      - name: 删除本次已合并分支
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          [ "$MERGED_HEAD" = "main" ] || gh api --method DELETE "repos/$REPO/git/refs/heads/$MERGED_HEAD" >/dev/null 2>&1 || true
