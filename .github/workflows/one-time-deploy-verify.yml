name: 一次性部署并验证 Pages

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-verify:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装网页生成依赖
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 生成并校验最新中文版网页
        shell: bash
        run: |
          python tools/build_reviewed_web.py
          grep -Fq '"title":"修订公告"' web/data.js
          grep -Fq '"title":"目录"' web/data.js
          grep -Fq '本项目为非官方中文阅读版' web/data.js
          grep -Fq '"title":"飞盘精神"' web/data.js
          grep -Fq '"title":"验盘（Check）"' web/data.js
          grep -Fq '"title":"攻防转换"' web/data.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 验证线上部署内容
        shell: bash
        run: |
          curl -fsSL --retry 8 --retry-delay 5 \
            https://hooooyu.github.io/frisbee-rules-manual/data.js \
            -o /tmp/live-data.js
          grep -Fq '"title":"修订公告"' /tmp/live-data.js
          grep -Fq '"title":"目录"' /tmp/live-data.js
          grep -Fq '本项目为非官方中文阅读版' /tmp/live-data.js
          grep -Fq '"title":"飞盘精神"' /tmp/live-data.js
          grep -Fq '"title":"验盘（Check）"' /tmp/live-data.js
          grep -Fq '"title":"攻防转换"' /tmp/live-data.js

      - name: 删除本次已合并验证分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          [ "$MERGED_HEAD" = "main" ] || gh api --method DELETE "repos/$REPO/git/refs/heads/$MERGED_HEAD" >/dev/null 2>&1 || true
