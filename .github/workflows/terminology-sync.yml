name: 一次性术语统一

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terminology-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 统一 marker 相关术语
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          decision = Path("docs/WFDF-极限飞盘规则-判定流程图-中文转写.md")
          builder = Path("build_web_handbook.py")
          data = Path("web/data.js")

          plans = {
              decision: [
                  ("标记者", "防盘队员"),
                  ("盯人违例", "防盘违规"),
              ],
              builder: [
                  ('["标记者（marker）", "可以对持盘者执行 stall 计数的防守队员。"]', '["防盘队员（marker）", "正在防守持盘队员，并可以对其执行读秒的防守方队员。"]'),
                  ("标记者", "防盘队员"),
                  ("盯人违例", "防盘违规"),
                  ("标记违例", "防盘违规"),
              ],
              data: [
                  ('["标记者（marker）","可以对持盘者执行 stall 计数的防守队员。"]', '["防盘队员（marker）","正在防守持盘队员，并可以对其执行读秒的防守方队员。"]'),
                  ("标记者", "防盘队员"),
                  ("盯人违例", "防盘违规"),
                  ("标记违例", "防盘违规"),
              ],
          }

          for path, replacements in plans.items():
              text = path.read_text(encoding="utf-8")
              before = text
              for old, new in replacements:
                  count = text.count(old)
                  if count:
                      print(f"{path}: {old!r} -> {new!r} x {count}")
                      text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding="utf-8")

          forbidden = ("标记者", "盯人违例", "标记违例")
          for path in plans:
              text = path.read_text(encoding="utf-8")
              leftovers = [term for term in forbidden if term in text]
              if leftovers:
                  raise SystemExit(f"{path} still contains: {leftovers}")

          expected_definition = "正在防守持盘队员，并可以对其执行读秒的防守方队员。"
          if expected_definition not in builder.read_text(encoding="utf-8"):
              raise SystemExit("Builder marker definition was not updated")
          if expected_definition not in data.read_text(encoding="utf-8"):
              raise SystemExit("Web data marker definition was not updated")
          PY

      - name: 检查并提交
        shell: bash
        run: |
          git diff --check
          git diff -- docs/WFDF-极限飞盘规则-判定流程图-中文转写.md build_web_handbook.py web/data.js
          if git diff --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WFDF-极限飞盘规则-判定流程图-中文转写.md build_web_handbook.py web/data.js
          git commit -m "Unify marker terminology"
          git push origin HEAD:main
