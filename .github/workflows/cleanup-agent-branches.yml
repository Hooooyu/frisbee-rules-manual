name: Cleanup merged agent branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-agent-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete merged agent branches
        run: |
          git push origin --delete \
            agent/add-hand-signal-images \
            agent/bust-reference-cache \
            agent/fix-appendix-tables \
            agent/inline-rule-reference-previews \
            agent/rule-reference-previews
